<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AzkarPlayer · light-ltr</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../common/frames.css">
<link rel="stylesheet" href="../../common/frame.css">
<script src="../../common/frame.js" defer></script>
</head>
<body class="artboard" data-kind="phone" data-fixed="0" data-variant="light-ltr" data-source="AzkarPlayer" data-how="derived">
<div dir="ltr" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: rgb(247, 243, 234); color: rgb(19, 35, 31); font-family: &quot;IBM Plex Sans Arabic&quot;, system-ui, sans-serif;" data-frame-root="">
  <div style="position: absolute; top: 0px; right: 0px; bottom: 0px; left: 0px; background: rgba(19, 35, 31, 0.35);" data-role="scrim"></div>
  <div style="position: absolute; top: 52px; right: 0px; left: 0px; bottom: 0px; background: rgb(255, 253, 248); border: 1px solid rgb(231, 223, 204); border-bottom: 0; border-radius: 36px 36px 0 0; box-shadow: rgba(0,0,0,0.18) 0px -8px 32px; padding: 10px 24px 30px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box;" data-role="bleed">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: rgb(231, 223, 204); align-self: center;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span aria-label="Minimize player" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: rgb(19, 35, 31);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      <span style="font-size: 13px; font-weight: 500; color: rgb(91, 106, 100);">Now playing</span>
      <span style="width: 44px; height: 44px;"></span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <h1 style="margin: 0px; font-size: 22px; font-weight: 700;">Morning azkar</h1>
      <span style="font-size: 13px; color: rgb(91, 106, 100);">Dhikr  5 of 24</span>
    </div>
    <div style="flex: 1; min-height: 0px; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 14px 16px; border-radius: 20px; border: 1px solid rgb(231, 223, 204); background: rgb(255, 253, 248);">
      <p style="margin: 0px; font-size: 15px; line-height: 22px; color: rgb(91, 106, 100); text-align: center;">[instructions from the source]</p>
      <p style="font-family: Amiri, serif; font-size: 24px; line-height: 48px; color: rgb(19, 35, 31); margin: 0px; text-align: center;" dir="rtl">[نص الذكر كما ورد في المصدر] [نص الذكر كما ورد في المصدر]</p>
      <p style="margin: 0px; font-family: &#x27;Amiri Quran&#x27;, Amiri, serif; font-size: 22px; line-height: 2.1; color: rgb(19, 35, 31); text-align: center;" dir="rtl">﴿[آية من المصحف بخط المصحف]﴾</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="height: 4px; border-radius: 2px; background: rgb(231, 223, 204);"><div style="width: 40%; height: 4px; border-radius: 2px; background: rgb(31, 77, 64);"></div></div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: rgb(91, 106, 100);"><span>0:24</span><span>-0:45</span></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 28px;">
      <span aria-label="Previous dhikr" style="width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: rgb(19, 35, 31);"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style=""><path d="M7 6h2v12H7zM10 12l8-6v12z"></path></svg></span>
      <span aria-label="Pause recording" style="width: 76px; height: 76px; border-radius: 38px; background: rgb(31, 77, 64); color: rgb(247, 243, 234); display: flex; align-items: center; justify-content: center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg></span>
      <span aria-label="Next dhikr" style="width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; color: rgb(19, 35, 31);"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style=""><path d="M15 6h2v12h-2zM6 6l8 6-8 6z"></path></svg></span>
    </div>
    <div style="align-self: center; padding: 4px 12px; border-radius: 14px; background: rgb(239, 232, 216); font-size: 12px; font-weight: 600; color: rgb(91, 106, 100);">2 of 3</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 4px; padding: 6px; border-radius: 28px; background: rgba(255, 255, 255, 0.6); border: 1px solid rgb(231, 223, 204);">
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; font-size: 12px; font-weight: 600; color: rgb(31, 77, 64);">By count</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; font-size: 12px; font-weight: 500; color: rgb(19, 35, 31);">Speed  1×</span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; font-size: 12px; font-weight: 500; color: rgb(19, 35, 31);">Sleep timer</span>
    </div>
    <div style="text-align: center; font-size: 13px; color: rgb(91, 106, 100);">Recited by Mohammed Jumaa for OpenDua</div>
    <div style="text-align: center; font-size: 12px; font-weight: 600; color: rgb(31, 77, 64);">opendua.org/developers</div>
  </div>
</div>
</body>
</html>
