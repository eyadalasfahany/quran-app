<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: 'Plex Arabic'; src: url('../../../apps/mobile/assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Regular.ttf'); font-weight: 400; }
    @font-face { font-family: 'Plex Arabic'; src: url('../../../apps/mobile/assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Bold.ttf'); font-weight: 700; }
    @font-face { font-family: 'Amiri Quran'; src: url('../../../apps/mobile/assets/fonts/Amiri/AmiriQuran.ttf'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 2853px; height: 2007px; overflow: hidden; }
    body { background: #F7F3EA; color: #13231F; font-family: 'Plex Arabic', sans-serif; }
    .canvas { width: 2853px; height: 2007px; position: relative; overflow: hidden; background: radial-gradient(circle at 8% 15%, #FFFDF8 0 14%, transparent 36%), #F7F3EA; }
    .ornament { position: absolute; width: 800px; height: 800px; top: -465px; left: -300px; border: 5px solid rgba(201, 169, 97, .34); transform: rotate(45deg); }
    .ornament::after { content: ''; position: absolute; inset: 150px; border: 5px solid rgba(201, 169, 97, .25); }
    .copy { position: absolute; z-index: 1; top: 190px; right: 140px; width: 850px; }
    .brand { color: #1F4D40; font-family: 'Amiri Quran', serif; font-size: 78px; line-height: 1.2; }
    h1 { margin: 46px 0 25px; font-size: 98px; line-height: 1.2; font-weight: 700; letter-spacing: -.7px; }
    p { margin: 0; color: #5B6A64; font-size: 42px; line-height: 1.55; }
    .screen { position: absolute; left: 100px; bottom: 140px; width: 1750px; height: 1223px; overflow: hidden; border: 8px solid #FFFDF8; border-radius: 72px; background: #FFFDF8; box-shadow: 0 34px 80px rgba(19, 35, 31, .17); }
    .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="ornament" aria-hidden="true"></div>
    <section class="copy">
      <div class="brand">طيبة</div>
      <h1>تجربة واسعة، بلا تشتيت.</h1>
      <p>تصفح المصحف، تابع وِردك، واستمع بسهولة في مساحة أكبر.</p>
    </section>
    <div class="screen"><img src="expanded-home-reference.png" alt="واجهة طيبة الواسعة على iPhone Duo"></div>
  </main>
</body>
</html>
