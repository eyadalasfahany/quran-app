<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: 'Plex Arabic'; src: url('../../../apps/mobile/assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Regular.ttf'); font-weight: 400; }
    @font-face { font-family: 'Plex Arabic'; src: url('../../../apps/mobile/assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Bold.ttf'); font-weight: 700; }
    @font-face { font-family: 'Amiri Quran'; src: url('../../../apps/mobile/assets/fonts/Amiri/AmiriQuran.ttf'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1179px; height: 2556px; overflow: hidden; }
    body { background: #F7F3EA; color: #13231F; font-family: 'Plex Arabic', sans-serif; }
    .canvas { width: 1179px; height: 2556px; position: relative; overflow: hidden; background: radial-gradient(circle at 18% 5%, #FFFDF8 0 18%, transparent 40%), #F7F3EA; }
    .ornament { position: absolute; top: -115px; left: -140px; width: 590px; height: 590px; border: 3px solid rgba(201, 169, 97, .35); transform: rotate(45deg); }
    .ornament::after { content: ''; position: absolute; inset: 110px; border: 3px solid rgba(201, 169, 97, .25); }
    .copy { position: relative; z-index: 1; text-align: center; padding: 162px 90px 42px; }
    .brand { color: #1F4D40; font-family: 'Amiri Quran', serif; font-size: 72px; line-height: 1.2; }
    h1 { margin: 32px 0 14px; font-size: 78px; line-height: 1.25; font-weight: 700; letter-spacing: -.6px; }
    p { margin: 0; color: #5B6A64; font-size: 36px; line-height: 1.55; }
    .screen { position: absolute; z-index: 1; left: 133px; bottom: 91px; width: 913px; height: 1975px; overflow: hidden; border: 6px solid #FFFDF8; border-radius: 64px; background: #FFFDF8; box-shadow: 0 28px 70px rgba(19, 35, 31, .16); }
    .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="ornament" aria-hidden="true"></div>
    <section class="copy">
      <div class="brand">طيبة</div>
      <h1>مصحفك، بهدوء.</h1>
      <p>اقرأ، استمع، وتابع وِردك اليومي في مكان واحد.</p>
    </section>
    <div class="screen"><img src="main-reference.png" alt="واجهة طيبة الرئيسية"></div>
  </main>
</body>
</html>
