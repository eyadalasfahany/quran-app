<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: 'Plex Arabic'; src: url('../../../apps/mobile/assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Regular.ttf'); font-weight: 400; }
    @font-face { font-family: 'Plex Arabic'; src: url('../../../apps/mobile/assets/fonts/IBMPlexSansArabic/IBMPlexSansArabic-Bold.ttf'); font-weight: 700; }
    @font-face { font-family: 'Amiri Quran'; src: url('../../../apps/mobile/assets/fonts/Amiri/AmiriQuran.ttf'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 2752px; height: 2064px; overflow: hidden; }
    body { background: #F7F3EA; color: #13231F; font-family: 'Plex Arabic', sans-serif; }
    .canvas { width: 2752px; height: 2064px; position: relative; overflow: hidden; background: radial-gradient(circle at 88% 0%, #FFFDF8 0 16%, transparent 39%), #F7F3EA; }
    .ornament { position: absolute; width: 760px; height: 760px; top: -470px; right: -260px; border: 5px solid rgba(201, 169, 97, .34); transform: rotate(45deg); }
    .ornament::after { content: ''; position: absolute; inset: 145px; border: 5px solid rgba(201, 169, 97, .25); }
    .copy { position: relative; z-index: 1; text-align: center; padding: 112px 260px 24px; }
    .brand { color: #1F4D40; font-family: 'Amiri Quran', serif; font-size: 76px; line-height: 1.2; }
    h1 { margin: 28px 0 13px; font-size: 88px; line-height: 1.22; font-weight: 700; letter-spacing: -.7px; }
    p { margin: 0; color: #5B6A64; font-size: 38px; line-height: 1.5; }
    .screen { position: absolute; left: 276px; bottom: 90px; width: 2200px; height: 1537px; overflow: hidden; border: 8px solid #FFFDF8; border-radius: 72px; background: #FFFDF8; box-shadow: 0 34px 80px rgba(19, 35, 31, .17); }
    .screen img { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="ornament" aria-hidden="true"></div>
    <section class="copy">
      <div class="brand">طيبة</div>
      <h1>تدبّر في مساحة أوسع.</h1>
      <p>اقرأ الآيات وارجع إلى التفسير بوضوح وراحة.</p>
    </section>
    <div class="screen"><img src="expanded-tafsir-reference.png" alt="واجهة طيبة للتدبر والتفسير على iPad"></div>
  </main>
</body>
</html>
