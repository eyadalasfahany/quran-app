<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: 'Amiri Quran'; src: url('../../../apps/mobile/assets/fonts/Amiri/AmiriQuran.ttf') format('truetype'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 3840px; height: 2560px; overflow: hidden; }
    body { background: #f7f3ea; color: #13231f; }
    .canvas { position: relative; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(145deg, #fbf8f1 0 59%, #e8efea 59% 100%); }
    .disc { position: absolute; left: -390px; top: -455px; width: 1700px; height: 1700px; border-radius: 50%; background: #ead39b; opacity: .74; }
    .disc::after { content: ''; position: absolute; inset: 150px; border: 18px solid rgba(31,77,64,.22); border-radius: 50%; }
    .grid { position: absolute; left: 1380px; bottom: -220px; width: 1580px; height: 1580px; opacity: .12; transform: rotate(45deg); background: repeating-linear-gradient(45deg, transparent 0 80px, #1f4d40 82px 88px, transparent 89px 170px), repeating-linear-gradient(-45deg, transparent 0 80px, #1f4d40 82px 88px, transparent 89px 170px); }
    .copy { position: absolute; top: 400px; left: 1900px; width: 1500px; text-align: right; }
    .brand { font-family: 'Amiri Quran', serif; color: #1f4d40; font-weight: 700; font-size: 340px; line-height: .92; }
    .eyebrow { margin-top: 120px; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #8c6a2b; font-size: 54px; font-weight: 700; }
    h1 { margin: 28px 0 32px; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #13231f; font-size: 130px; line-height: 1.18; }
    p { margin: 0; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #5b6a64; font-size: 58px; line-height: 1.55; }
    .phone { position: absolute; left: 370px; bottom: -165px; width: 1160px; height: 2500px; padding: 38px; border-radius: 126px 126px 0 0; background: #13231f; box-shadow: 0 56px 110px rgba(19,35,31,.27); overflow: hidden; }
    .phone::before { content: ''; position: absolute; top: 34px; left: 50%; width: 380px; height: 56px; border-radius: 40px; background: #13231f; transform: translateX(-50%); z-index: 2; }
    .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; border-radius: 98px 98px 0 0; }
    .tag { position: absolute; left: 1900px; bottom: 360px; padding: 36px 54px; border: 4px solid #c9a961; border-radius: 999px; color: #1f4d40; font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 50px; font-weight: 700; background: rgba(255,253,248,.8); }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="disc"></div><div class="grid"></div>
    <section class="copy" aria-label="Taybah Quran search">
      <div class="brand">طيبة</div>
      <div class="eyebrow">البحث في القرآن</div>
      <h1>ابحث عن الآيات والسور والتفسير.</h1>
      <p>تصل إلى ما تبحث عنه بسرعة، مع نتائج واضحة وتجربة عربية أولًا.</p>
    </section>
    <div class="tag">بحث سريع ودقيق</div>
    <div class="phone"><img src="search-reference.png" alt="واجهة البحث في طيبة"></div>
  </main>
</body>
</html>
