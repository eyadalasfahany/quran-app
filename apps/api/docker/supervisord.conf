; One API container runs the web server, Horizon and the scheduler (ADR 0065). start-web.sh execs this after the
; migrations, imports and pack builds, so the workers never see an unmigrated schema. Every program logs to the
; container's stdout for Railway.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=frankenphp run --config /etc/caddy/Caddyfile
directory=/app
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:horizon]
command=php /app/artisan horizon
directory=/app
autorestart=true
stopsignal=TERM
; Horizon finishes the job it is running before it exits. Railway's draining seconds must be longer than this.
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=php /app/artisan schedule:work
directory=/app
autorestart=true
stopsignal=TERM
stopwaitsecs=120
; schedule:work starts schedule:run children; stop and kill them with it.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; If the web server crashes too often to restart (FATAL), stop the container so Railway restarts it.
; Horizon or the scheduler failing (for example, Redis down) never stops the web server.
[eventlistener:web_fatal]
command=/usr/local/bin/supervisor-web-fatal.sh
events=PROCESS_STATE_FATAL
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
