[project]
name = "recitation-align"
version = "0.1.0"
description = "Local dev tool: word-level timings for a recitation file against Tanzil text. Never runs on the server (ADR 0052)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchaudio",
    "transformers",
    "rapidfuzz",
    "numpy",
]

[project.scripts]
recitation-align = "recitation_align.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recitation_align"]

[tool.pytest.ini_options]
testpaths = ["tests"]
