[project]
name = "mp3quran-ingest"
version = "0.1.0"
description = "Local dev tool: copies MP3Quran surah files to Taybah's R2 bucket and writes the manifest (ADR 0061). Never runs on the server."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3",
]

[project.scripts]
mp3quran-ingest = "mp3quran_ingest.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "moto[s3]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mp3quran_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
