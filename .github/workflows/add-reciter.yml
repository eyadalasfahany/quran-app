name: Add reciter (MP3Quran or Way2Quran)

# Manual only. Copies one reciter's surah files to R2, aligns them on CPU runners and opens a PR with the
# manifest and the timings (ADR 0061, amended 5 Nov 2026; Way2Quran: ADR 0074). `source` picks the path:
# mp3quran uses the published timings (the default, unchanged); way2quran aligns every surah itself, because
# Way2Quran publishes no timings. The workflow never pushes to the default branch. Production never runs this;
# the Railway deploy imports the merged manifest. `quality` (Way2Quran only, ADR 0077) checks each file's
# completeness before anything is uploaded and uploads only complete surahs, last.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Reciter source: mp3quran (published timings, the default) or way2quran (aligner only, ADR 0074)"
        required: true
        default: "mp3quran"
        type: choice
        options:
          - mp3quran
          - way2quran
      moshaf_ids:
        description: "MP3Quran moshaf ids (source mp3quran, Hafs only, with published timings) or reciter ids for way2quran, comma-separated"
        required: true
        type: string
      chunks:
        description: "Align chunks per moshaf (1 to 20); empty: 6 for mp3quran, 20 for way2quran"
        required: false
        default: ""
        type: string
      quality:
        description: "Way2Quran only: completeness, anchors, repeats and gate (ADR 0077)"
        required: false
        default: false
        type: boolean
      calibrate:
        description: "Way2Quran quality only: calibration run on the surahs of checks/calibration-surahs.json, nothing uploaded and no PR (plan Q10)"
        required: false
        default: false
        type: boolean
      resume_run_id:
        description: "Resume: an earlier run's id. Only the chunks it never uploaded are aligned (same moshaf ids and chunks; its artifacts last 7 days)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: add-reciter-${{ inputs.source }}-${{ inputs.moshaf_ids }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (refuse or chunk)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      moshafs: ${{ steps.plan.outputs.moshafs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate inputs and plan
        id: plan
        env:
          SOURCE: ${{ inputs.source }}
          MOSHAF_IDS: ${{ inputs.moshaf_ids }}
          CHUNKS: ${{ inputs.chunks }}
          QUALITY: ${{ inputs.source == 'way2quran' && inputs.quality }}
          CALIBRATE: ${{ inputs.source == 'way2quran' && inputs.calibrate }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DONE=""
          if [ -n "$RESUME_RUN_ID" ]; then
            if ! [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::resume_run_id must be a run id"
              exit 1
            fi
            WORKFLOW=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" --jq '.path')
            if [[ "$WORKFLOW" != .github/workflows/add-reciter.yml* ]]; then
              echo "::error::run $RESUME_RUN_ID is not an add-reciter run"
              exit 1
            fi
            DONE=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.expired | not) | .name' | paste -sd, -)
            echo "resuming run $RESUME_RUN_ID; reusing: ${DONE:-nothing}"
          fi
          python3 tools/recitation-align/scripts/ci_plan.py --source "$SOURCE" --moshafs "$MOSHAF_IDS" --chunks "$CHUNKS" --done "$DONE"

  align:
    name: Align ${{ inputs.source == 'way2quran' && 'Way2Quran ' || '' }}${{ matrix.moshaf }} chunk ${{ matrix.chunk }}
    needs: plan
    # A resume whose earlier run already uploaded every chunk aligns nothing and goes straight to finalize.
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.chunks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Only this job reads the R2 keys, from the `production` environment (branch-restricted to main).
    environment: "taybah-app / production"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(format('{{"include":{0}}}', needs.plan.outputs.chunks)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            tools/mp3quran-ingest/uv.lock
            tools/recitation-align/uv.lock

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Model revision key
        id: models
        run: echo "key=$(grep '_REVISION' tools/recitation-align/recitation_align/models.py | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ steps.models.outputs.key }}

      - name: Install dependencies (frozen)
        run: |
          (cd tools/mp3quran-ingest && uv sync --frozen --no-dev)
          (cd tools/recitation-align && uv sync --frozen --no-dev)

      - name: Ingest chunk to R2 (s3)
        if: ${{ inputs.source == 'mp3quran' }}
        working-directory: tools/mp3quran-ingest
        env:
          MOSHAF: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
          SURAHS_JSON: ${{ toJSON(matrix.surahs) }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: quran
          R2_PUBLIC_BASE: https://audio.taybah-app.com
        run: |
          set -euo pipefail
          mapfile -t SURAH_ARGS < <(jq -r '.[] | ("--surah", tostring)' <<< "$SURAHS_JSON")
          uv run mp3quran-ingest ingest --moshaf "$MOSHAF" "${SURAH_ARGS[@]}" \
            --upload --via s3 --manifest "out/manifest-${MOSHAF}-${CHUNK}.json"

      - name: Ingest Way2Quran chunk to R2 (s3)
        if: ${{ inputs.source == 'way2quran' && !inputs.quality }}
        working-directory: tools/mp3quran-ingest
        env:
          RECITER: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
          SURAHS_JSON: ${{ toJSON(matrix.surahs) }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: quran
          R2_PUBLIC_BASE: https://audio.taybah-app.com
        run: |
          set -euo pipefail
          mapfile -t SURAH_ARGS < <(jq -r '.[] | ("--surah", tostring)' <<< "$SURAHS_JSON")
          uv run mp3quran-ingest ingest --source way2quran --reciter "$RECITER" "${SURAH_ARGS[@]}" \
            --upload --via s3 --manifest "out/manifest-${RECITER}-${CHUNK}.json"

      - name: Fetch MP3Quran published timings
        if: ${{ inputs.source == 'mp3quran' }}
        working-directory: tools/recitation-align
        env:
          MOSHAF: ${{ matrix.moshaf }}
          SURAHS_JSON: ${{ toJSON(matrix.surahs) }}
        run: |
          set -euo pipefail
          mapfile -t SURAH_ARGS < <(jq -r '.[] | ("--surah", tostring)' <<< "$SURAHS_JSON")
          python3 scripts/ci_fetch_published.py --moshaf "$MOSHAF" "${SURAH_ARGS[@]}"

      - name: Align Way2Quran words (aligner only)
        if: ${{ inputs.source == 'way2quran' && !inputs.quality }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
          SURAHS_JSON: ${{ toJSON(matrix.surahs) }}
          RECITATION_TORCH_THREADS: "4"
          # Show each surah's line as it finishes (stdout is block-buffered in CI otherwise).
          PYTHONUNBUFFERED: "1"
          # Optional: authenticated Hugging Face downloads get higher rate limits (empty is fine).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t SURAH_ARGS < <(jq -r '.[] | ("--surah", tostring)' <<< "$SURAHS_JSON")
          uv run python scripts/pilot_published.py --source-kind way2quran --moshaf "$RECITER" --aligner-only \
            --manifest "$GITHUB_WORKSPACE/tools/mp3quran-ingest/out/manifest-${RECITER}-${CHUNK}.json" \
            "${SURAH_ARGS[@]}"

      - name: Whisper model revision (Way2Quran quality)
        id: asr
        if: ${{ inputs.source == 'way2quran' && inputs.quality }}
        run: |
          set -euo pipefail
          REVISION=$(sed -n 's/^ASR_REVISION = "\(.*\)"$/\1/p' tools/recitation-align/recitation_align/models.py)
          if [ -z "$REVISION" ]; then
            echo "::error::ASR_REVISION not found in models.py"
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Cache the Whisper model (Way2Quran quality)
        if: ${{ inputs.source == 'way2quran' && inputs.quality }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--tarteel-ai--whisper-base-ar-quran
          key: hf-asr-${{ runner.os }}-${{ steps.asr.outputs.revision }}

      - name: Dry-ingest Way2Quran chunk (quality, download and hash, no upload)
        if: ${{ inputs.source == 'way2quran' && inputs.quality }}
        working-directory: tools/mp3quran-ingest
        env:
          RECITER: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
          SURAHS_JSON: ${{ toJSON(matrix.surahs) }}
          R2_PUBLIC_BASE: https://audio.taybah-app.com
        run: |
          set -euo pipefail
          mapfile -t SURAH_ARGS < <(jq -r '.[] | ("--surah", tostring)' <<< "$SURAHS_JSON")
          uv run mp3quran-ingest ingest --source way2quran --reciter "$RECITER" "${SURAH_ARGS[@]}" \
            --manifest "out/dry-manifest-${RECITER}-${CHUNK}.json"

      - name: Completeness (Way2Quran quality)
        if: ${{ inputs.source == 'way2quran' && inputs.quality }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
          SURAHS_JSON: ${{ toJSON(matrix.surahs) }}
          RECITATION_TORCH_THREADS: "4"
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          INGEST="$GITHUB_WORKSPACE/tools/mp3quran-ingest/out"
          mapfile -t SURAHS < <(jq -r '.[] | tostring' <<< "$SURAHS_JSON")
          uv run python scripts/w2q_completeness.py --reciter "$RECITER" \
            --manifest "$INGEST/dry-manifest-${RECITER}-${CHUNK}.json" \
            --audio-dir "$INGEST/audio/way2quran-${RECITER}" \
            --out-dir "out/way2quran/${RECITER}/completeness" --asr-dir "out/way2quran/${RECITER}/asr" \
            --surah "${SURAHS[@]}"

      - name: Align the complete Way2Quran surahs (quality)
        if: ${{ inputs.source == 'way2quran' && inputs.quality }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
          RECITATION_TORCH_THREADS: "4"
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          COMPLETENESS="out/way2quran/${RECITER}/completeness"
          mapfile -t SURAH_ARGS < <(jq -r '.[] | ("--surah", tostring)' "$COMPLETENESS/complete-surahs.json")
          if [ "${#SURAH_ARGS[@]}" -eq 0 ]; then
            echo "No complete surah in this chunk: nothing to align."
            exit 0
          fi
          uv run python scripts/pilot_published.py --source-kind way2quran --moshaf "$RECITER" --aligner-only \
            --quality --completeness-dir "$COMPLETENESS" \
            --manifest "$GITHUB_WORKSPACE/tools/mp3quran-ingest/out/dry-manifest-${RECITER}-${CHUNK}.json" \
            "${SURAH_ARGS[@]}"

      - name: Gate (Way2Quran quality)
        if: ${{ inputs.source == 'way2quran' && inputs.quality }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
          SURAHS_JSON: ${{ toJSON(matrix.surahs) }}
          RECITATION_TORCH_THREADS: "4"
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          INGEST="$GITHUB_WORKSPACE/tools/mp3quran-ingest/out"
          BASE="out/way2quran/${RECITER}"
          mapfile -t SURAHS < <(jq -r '.[] | tostring' <<< "$SURAHS_JSON")
          # A record for every surah of the chunk: G0 for the incomplete ones, G1 for the refused ones. It runs
          # even when no surah is complete, so the upload step always has its list.
          uv run python scripts/w2q_gate.py --reciter "$RECITER" --surah "${SURAHS[@]}" \
            --audio-dir "$INGEST/audio/way2quran-${RECITER}" --aligned-dir "$BASE/aligned" \
            --completeness-dir "$BASE/completeness" --refused-dir "$BASE/refused" --asr-dir "$BASE/asr" \
            --pauses-dir "$BASE/pauses" --out-dir "$BASE/gate"

      - name: Upload the available Way2Quran surahs to R2 (quality, last)
        if: ${{ inputs.source == 'way2quran' && inputs.quality && !inputs.calibrate }}
        working-directory: tools/mp3quran-ingest
        env:
          RECITER: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: quran
          R2_PUBLIC_BASE: https://audio.taybah-app.com
        run: |
          set -euo pipefail
          # The gate's list: every surah whose verdict is not `unavailable`. A `no_highlight` surah still uploads
          # (its audio is available); an `unavailable` one never reaches R2 (P1).
          AVAILABLE="$GITHUB_WORKSPACE/tools/recitation-align/out/way2quran/${RECITER}/gate/available-surahs.json"
          mapfile -t SURAH_ARGS < <(jq -r '.[] | ("--surah", tostring)' "$AVAILABLE")
          # An empty --surah list would mean every surah of the reciter, so an empty list uploads nothing.
          if [ "${#SURAH_ARGS[@]}" -eq 0 ]; then
            echo "No available surah in this chunk: nothing to upload."
            exit 0
          fi
          uv run mp3quran-ingest ingest --source way2quran --reciter "$RECITER" "${SURAH_ARGS[@]}" \
            --upload --via s3 --source-dir "out/audio/way2quran-${RECITER}" \
            --manifest "out/manifest-${RECITER}-${CHUNK}.json"
          VERIFY_ARGS=()
          while IFS= read -r SURAH; do VERIFY_ARGS+=(--surah "$SURAH"); done < <(jq -r '.[] | tostring' "$AVAILABLE")
          python3 "$GITHUB_WORKSPACE/tools/recitation-align/scripts/w2q_verify_upload.py" --reciter "$RECITER" \
            --dry "out/dry-manifest-${RECITER}-${CHUNK}.json" --uploaded "out/manifest-${RECITER}-${CHUNK}.json" \
            "${VERIFY_ARGS[@]}"

      - name: Stage hand-off files (Way2Quran quality)
        if: ${{ inputs.source == 'way2quran' && inputs.quality }}
        env:
          RECITER: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
          SURAHS_JSON: ${{ toJSON(matrix.surahs) }}
        run: |
          set -euo pipefail
          python3 tools/recitation-align/scripts/w2q_stage.py --reciter "$RECITER" --chunk "$CHUNK" \
            --surahs-json "$SURAHS_JSON" --ingest-out tools/mp3quran-ingest/out \
            --align-out "tools/recitation-align/out/way2quran/${RECITER}" --handoff "$RUNNER_TEMP/handoff"

      - name: Align words inside published spans
        if: ${{ inputs.source == 'mp3quran' }}
        working-directory: tools/recitation-align
        env:
          MOSHAF: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
          SURAHS_JSON: ${{ toJSON(matrix.surahs) }}
          RECITATION_TORCH_THREADS: "4"
          # Show each surah's line as it finishes (stdout is block-buffered in CI otherwise).
          PYTHONUNBUFFERED: "1"
          # Optional: authenticated Hugging Face downloads get higher rate limits (empty is fine).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t SURAH_ARGS < <(jq -r '.[] | ("--surah", tostring)' <<< "$SURAHS_JSON")
          uv run python scripts/pilot_published.py --moshaf "$MOSHAF" --fallback-aligner \
            --manifest "$GITHUB_WORKSPACE/tools/mp3quran-ingest/out/manifest-${MOSHAF}-${CHUNK}.json" \
            "${SURAH_ARGS[@]}"

      - name: Stage hand-off files (Way2Quran)
        if: ${{ inputs.source == 'way2quran' && !inputs.quality }}
        env:
          RECITER: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          HANDOFF="$RUNNER_TEMP/handoff"
          mkdir -p "$HANDOFF/aligned"
          cp "tools/mp3quran-ingest/out/manifest-${RECITER}-${CHUNK}.json" "$HANDOFF/"
          cp tools/recitation-align/out/way2quran/"$RECITER"/aligned/*.json "$HANDOFF/aligned/"

      - name: Stage hand-off files
        if: ${{ inputs.source == 'mp3quran' }}
        env:
          MOSHAF: ${{ matrix.moshaf }}
          CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          HANDOFF="$RUNNER_TEMP/handoff"
          mkdir -p "$HANDOFF/aligned"
          cp "tools/mp3quran-ingest/out/manifest-${MOSHAF}-${CHUNK}.json" "$HANDOFF/"
          cp tools/recitation-align/out/published/"$MOSHAF"/aligned/*.json "$HANDOFF/aligned/"

      - name: Upload hand-off
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.source == 'way2quran' && format('align-w2q-{0}-{1}', matrix.moshaf, matrix.chunk) || format('align-{0}-{1}', matrix.moshaf, matrix.chunk) }}
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Finalize ${{ inputs.source == 'way2quran' && 'Way2Quran ' || '' }}${{ matrix.moshaf }} and open PR
    needs: [plan, align]
    # Runs even when one chunk failed: the merge refuses a partial reciter, so only complete ones ship.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        moshaf: ${{ fromJSON(needs.plan.outputs.moshafs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The latest default branch, not the dispatch commit: the PR branch then carries only the reciter.
          # From an older commit it would also revert anything merged since, and GitHub refuses a bot push
          # that touches a workflow file (run 42213906432).
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: tools/recitation-align/uv.lock

      - name: Download hand-offs reused from the resumed run
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.source == 'way2quran' && format('align-w2q-{0}-*', matrix.moshaf) || format('align-{0}-*', matrix.moshaf) }}
          merge-multiple: true
          path: ${{ runner.temp }}/handoff
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: Download hand-offs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.source == 'way2quran' && format('align-w2q-{0}-*', matrix.moshaf) || format('align-{0}-*', matrix.moshaf) }}
          merge-multiple: true
          path: ${{ runner.temp }}/handoff

      - name: Merge manifest (refuses a partial reciter)
        if: ${{ inputs.source == 'mp3quran' }}
        working-directory: tools/recitation-align
        env:
          MOSHAF: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          ALIGNED="out/published/${MOSHAF}/aligned"
          mkdir -p "$ALIGNED"
          cp "$RUNNER_TEMP"/handoff/aligned/*.json "$ALIGNED/"
          python3 scripts/ci_merge_manifest.py --moshaf "$MOSHAF" \
            --parts "$RUNNER_TEMP/handoff" --aligned "$ALIGNED"

      - name: Merge manifest (Way2Quran, refuses a partial reciter)
        if: ${{ inputs.source == 'way2quran' && !inputs.quality }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          ALIGNED="out/way2quran/${RECITER}/aligned"
          mkdir -p "$ALIGNED"
          cp "$RUNNER_TEMP"/handoff/aligned/*.json "$ALIGNED/"
          python3 scripts/ci_merge_manifest.py --source way2quran --moshaf "$RECITER" \
            --parts "$RUNNER_TEMP/handoff" --aligned "$ALIGNED"

      - name: Export committed timing files
        if: ${{ inputs.source == 'mp3quran' }}
        working-directory: tools/recitation-align
        env:
          MOSHAF: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev
          uv run python -m recitation_align.export --kind mp3quran --recitation-key "$MOSHAF" \
            --in "out/published/${MOSHAF}/aligned" \
            --out "../../apps/api/resources/recitation-timings/mp3quran/${MOSHAF}" \
            --source mp3quran_published

      - name: Export committed timing files (Way2Quran)
        if: ${{ inputs.source == 'way2quran' && !inputs.quality }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev
          uv run python -m recitation_align.export --kind way2quran --recitation-key "$RECITER" \
            --in "out/way2quran/${RECITER}/aligned" \
            --out "../../apps/api/resources/recitation-timings/way2quran/${RECITER}" \
            --source aligner

      - name: Merge the reciter report (Way2Quran quality)
        if: ${{ inputs.source == 'way2quran' && inputs.quality && !inputs.calibrate }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev
          PREVIOUS=()
          if [ -f "checks/way2quran-${RECITER}.json" ]; then
            PREVIOUS=(--previous "checks/way2quran-${RECITER}.json")
          fi
          # Every complete surah has a gate record or a refusal (the align job's Gate step). Nothing is releasable
          # until the A6(a) record exists (R5).
          uv run python scripts/w2q_report.py merge --reciter "$RECITER" --handoff "$RUNNER_TEMP/handoff" \
            --out "checks/way2quran-${RECITER}.json" --run-id "$GITHUB_RUN_ID" \
            "${PREVIOUS[@]}"

      - name: Exclude unavailable surahs from the reciter data file (Way2Quran quality)
        if: ${{ inputs.source == 'way2quran' && inputs.quality && !inputs.calibrate }}
        working-directory: tools/mp3quran-ingest
        env:
          RECITER: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev
          uv run mp3quran-ingest way2quran-exclude --reciter "$RECITER" \
            --report "../recitation-align/checks/way2quran-${RECITER}.json" --write

      - name: Merge manifest (Way2Quran quality, the remaining surahs)
        if: ${{ inputs.source == 'way2quran' && inputs.quality && !inputs.calibrate }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ALIGNED="out/way2quran/${RECITER}/aligned"
          REFUSED="out/way2quran/${RECITER}/refused"
          mkdir -p "$ALIGNED" "$REFUSED"
          DOCS=("$RUNNER_TEMP"/handoff/aligned/*.json)
          if [ "${#DOCS[@]}" -gt 0 ]; then cp "${DOCS[@]}" "$ALIGNED/"; fi
          MARKS=("$RUNNER_TEMP"/handoff/refused/*.json)
          if [ "${#MARKS[@]}" -gt 0 ]; then cp "${MARKS[@]}" "$REFUSED/"; fi
          PARTS=("$RUNNER_TEMP"/handoff/manifest-"$RECITER"-*.json)
          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo "No chunk uploaded a surah: this reciter has no manifest entry."
            exit 0
          fi
          python3 scripts/ci_merge_manifest.py --source way2quran --moshaf "$RECITER" \
            --parts "$RUNNER_TEMP/handoff" --aligned "$ALIGNED" --refused "$REFUSED" \
            --data ../mp3quran-ingest/mp3quran_ingest/way2quran_reciters.json

      - name: Export committed timing files (Way2Quran quality, gated)
        if: ${{ inputs.source == 'way2quran' && inputs.quality && !inputs.calibrate }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ALIGNED="out/way2quran/${RECITER}/aligned"
          GATE="$RUNNER_TEMP/handoff/gate"
          DOCS=("$ALIGNED"/*.json "$GATE"/*.json)
          if [ "${#DOCS[@]}" -eq 0 ]; then
            echo "No aligned surah and no gate record: no timing files to export."
            exit 0
          fi
          uv sync --frozen --no-dev
          # Only `pass` and `repaired` surahs get a file; a `segments_null` ayah is written with "segments": null.
          uv run python -m recitation_align.gated_export --kind way2quran --recitation-key "$RECITER" \
            --in "$ALIGNED" --gate-dir "$GATE" \
            --out "../../apps/api/resources/recitation-timings/way2quran/${RECITER}" \
            --source aligner

      - name: Calibration summary (Way2Quran quality)
        if: ${{ inputs.source == 'way2quran' && inputs.quality && inputs.calibrate }}
        env:
          RECITER: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          # Asserts the known outcomes of this reciter's calibration surahs and writes the job summary. The speed
          # is pooled and projected afterwards by `w2q_calibration_check.py combine` (plan Q10).
          python3 tools/recitation-align/scripts/w2q_calibration_check.py check --reciter "$RECITER" \
            --handoff "$RUNNER_TEMP/handoff"

      - name: Test recitation-align
        working-directory: tools/recitation-align
        run: |
          uv sync --frozen
          uv run pytest -q

      - name: Quality summary
        if: ${{ inputs.source == 'mp3quran' }}
        working-directory: tools/recitation-align
        env:
          MOSHAF: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          python3 scripts/ci_quality.py --moshaf "$MOSHAF" \
            --aligned "out/published/${MOSHAF}/aligned" --out "$RUNNER_TEMP/quality.md"

      - name: Quality summary (Way2Quran)
        if: ${{ inputs.source == 'way2quran' && !inputs.quality }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          python3 scripts/ci_quality.py --source way2quran --moshaf "$RECITER" \
            --aligned "out/way2quran/${RECITER}/aligned" --out "$RUNNER_TEMP/quality.md"

      - name: Commit, push branch and open PR
        if: ${{ inputs.source == 'mp3quran' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MOSHAF: ${{ matrix.moshaf }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="reciter/${MOSHAF}-${GITHUB_RUN_ID}"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::refusing to push to the default branch"
            exit 1
          fi
          MANIFEST_PATH="apps/api/resources/mp3quran/manifest.json"
          TIMINGS_PATH="apps/api/resources/recitation-timings/mp3quran/${MOSHAF}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$MANIFEST_PATH" "$TIMINGS_PATH"
          if git diff --cached --quiet; then
            echo "::error::nothing changed for moshaf ${MOSHAF}"
            exit 1
          fi
          git commit -m "Reciter: MP3Quran moshaf ${MOSHAF} (run ${GITHUB_RUN_ID})"
          git push origin "$BRANCH"
          {
            echo "Automated run ${GITHUB_RUN_ID} for MP3Quran moshaf ${MOSHAF}."
            echo
            echo "Contains the manifest entry and the published-span timings for every surah. Review, then merge; the Railway deploy imports the manifest."
            echo
            echo "## Quality (counts and confidences only)"
            echo
            cat "$RUNNER_TEMP/quality.md"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "Reciter: MP3Quran moshaf ${MOSHAF}" --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Commit, push branch and open PR (Way2Quran)
        if: ${{ inputs.source == 'way2quran' && !inputs.quality }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECITER: ${{ matrix.moshaf }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="reciter/way2quran-${RECITER}-${GITHUB_RUN_ID}"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::refusing to push to the default branch"
            exit 1
          fi
          MANIFEST_PATH="apps/api/resources/way2quran/manifest.json"
          TIMINGS_PATH="apps/api/resources/recitation-timings/way2quran/${RECITER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$MANIFEST_PATH" "$TIMINGS_PATH"
          if git diff --cached --quiet; then
            echo "::error::nothing changed for Way2Quran reciter ${RECITER}"
            exit 1
          fi
          git commit -m "Reciter: Way2Quran reciter ${RECITER} (run ${GITHUB_RUN_ID})"
          git push origin "$BRANCH"
          {
            echo "Automated run ${GITHUB_RUN_ID} for Way2Quran reciter ${RECITER}."
            echo
            echo "Contains the manifest entry and the aligner timings for every surah. Way2Quran publishes no timings, so every surah is aligned here (ADR 0074). Review, then merge; the Railway deploy imports the manifest. The reciter stays hidden until its id is in quran.way2quran_released_reciters."
            echo
            echo "## Quality (counts and confidences only)"
            echo
            cat "$RUNNER_TEMP/quality.md"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "Reciter: Way2Quran reciter ${RECITER}" --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Report markdown (Way2Quran quality)
        if: ${{ inputs.source == 'way2quran' && inputs.quality && !inputs.calibrate }}
        working-directory: tools/recitation-align
        env:
          RECITER: ${{ matrix.moshaf }}
        run: |
          set -euo pipefail
          uv run python scripts/w2q_report.py markdown --report "checks/way2quran-${RECITER}.json" \
            --out "$RUNNER_TEMP/w2q-report.md"

      - name: Commit, push branch and open PR (Way2Quran quality)
        if: ${{ inputs.source == 'way2quran' && inputs.quality && !inputs.calibrate }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECITER: ${{ matrix.moshaf }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="reciter/way2quran-${RECITER}-${GITHUB_RUN_ID}"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::refusing to push to the default branch"
            exit 1
          fi
          MANIFEST_PATH="apps/api/resources/way2quran/manifest.json"
          TIMINGS_PATH="apps/api/resources/recitation-timings/way2quran/${RECITER}"
          DATA_PATH="tools/mp3quran-ingest/mp3quran_ingest/way2quran_reciters.json"
          REPORT_PATH="tools/recitation-align/checks/way2quran-${RECITER}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$DATA_PATH" "$REPORT_PATH"
          if [ -f "$MANIFEST_PATH" ]; then git add "$MANIFEST_PATH"; fi
          if [ -d "$TIMINGS_PATH" ]; then git add "$TIMINGS_PATH"; fi
          if git diff --cached --quiet; then
            echo "::error::nothing changed for Way2Quran reciter ${RECITER}"
            exit 1
          fi
          git commit -m "Reciter: Way2Quran reciter ${RECITER} (quality, run ${GITHUB_RUN_ID})"
          git push origin "$BRANCH"
          {
            head -n 1 "$RUNNER_TEMP/w2q-report.md"
            echo
            echo "Automated quality run ${GITHUB_RUN_ID} for Way2Quran reciter ${RECITER} (ADR 0077). Only complete surahs were uploaded to R2; surahs the check found incomplete are listed below and moved to the reciter's excluded list in the data file. Every complete surah went through the gate; the reciter is not releasable until its A6(a) calibration record exists (R5). The reciter stays hidden until its id is in quran.way2quran_released_reciters."
            echo
            tail -n +2 "$RUNNER_TEMP/w2q-report.md"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
            --title "Reciter: Way2Quran reciter ${RECITER} (quality)" --body-file "$RUNNER_TEMP/pr-body.md"
